developer_instructions = """
Investigate the assigned research question using primary papers, official technical documentation, and the repository's own results. Open sources before citing them. For each important source, report authors, year, title, link, method, scale, and whether it used hardware or simulation. Separate what was already shown from what this repository may add; label unverified novelty or inaccessible claims explicitly. Do not edit files or submit jobs.
"""
