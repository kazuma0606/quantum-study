[project]
name = "quantum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.11.0",
    "arviz>=1.3.0",
    "jax>=0.11.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "numpyro>=0.22.0",
    "plotly>=7.1.0",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.50.0",
    "sbi>=0.27.0",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
tf = [
    "tensorflow>=2.21.0",
]

# PyTorch は CUDA 版（RTX 50 系＝Blackwell には CUDA 12.8 以降の版が要る）を PyTorch の公式の置き場所から入れる
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
